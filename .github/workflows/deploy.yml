name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ secrets.DEPLOY_PORT }} ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to server
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ secrets.DEPLOY_PORT }} ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} << 'EOF'
            set -e
            echo "=============== Starting deployment... ==============="

            # Navigate to project directory
            cd /var/www/llvmviz

            # Pull latest code
            echo "=============== Pulling latest code from main... ==============="
            git fetch origin
            git reset --hard origin/main

            # Build frontend
            echo "=============== Building frontend... ==============="
            cd frontend
            npm ci
            npm run build

            # Restart backend service
            echo "♻️ Restarting backend service..."
            sudo systemctl restart llvmviz-backend

            echo "=============== Deployment complete! ==============="
          EOF

      - name: Verify deployment
        run: |
          echo "🔍 Verifying deployment..."
          sleep 5
          curl -f https://llvmviz.org/ || (echo " XXX Frontend not responding" && exit 1)
          curl -f https://llvmviz.org/api/health || (echo "XXX Backend not responding" && exit 1)
          echo "=============== Deployment verified! ==============="
